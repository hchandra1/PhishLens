[project]
name = "phishlens"
version = "0.1.0"
description = "Explainable phishing analysis for small teams"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "pydantic>=2.11",
    "python-multipart>=0.0.32",
    "tldextract>=5.3.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phishlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Whitespace-separated word lists read better than one-item-per-line lists.
ignore = ["SIM905"]
